<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M 50,5 L 88,18 C 88,60 50,92 50,95 C 50,92 12,60 12,18 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Inner Inset Shield -->
  <path d="M 50,11 L 82,22 C 82,56 50,84 50,86 C 50,84 18,56 18,22 Z" 
        fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Stylized Speed / Piston / Car Silhouette Lines -->
  <!-- Sleek Car Roof & Hood contour -->
  <path d="M 26,48 Q 36,36 46,35 L 58,35 Q 70,36 76,46 L 79,52 C 79,52 75,50 68,50 L 32,50 Q 27,50 26,48 Z" 
        fill="url(#goldGrad)" />
  
  <!-- Car Windshield & Side Window Cutout -->
  <path d="M 38,46 L 46,38 L 56,38 L 64,46 Z" fill="#0f172a" opacity="0.8" />

  <!-- High-Precision Wrench Diagonal Across Emblem -->
  <g transform="translate(50, 62) rotate(-35) scale(0.68)">
    <!-- Wrench head -->
    <path d="M -8,-24 C -16,-20 -20,-10 -16,-2 C -14,2 -10,4 -6,5 L -6,22 C -6,25 -3,28 0,28 C 3,28 6,25 6,22 L 6,5 C 10,4 14,2 16,-2 C 20,-10 16,-20 8,-24 L 2,-16 L -2,-16 Z" 
          fill="url(#silverGrad)" stroke="#1e293b" stroke-width="1" />
    <circle cx="0" cy="22" r="2.5" fill="#0f172a" />
  </g>

  <!-- Star Accents (ASE Quality) -->
  <polygon points="50,16 52,21 57,21 53,24 55,29 50,26 45,29 47,24 43,21 48,21" fill="url(#goldGrad)" />
  <circle cx="34" cy="25" r="1.5" fill="#f8fafc" />
  <circle cx="66" cy="25" r="1.5" fill="#f8fafc" />
</svg>
