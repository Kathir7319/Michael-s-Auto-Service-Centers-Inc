<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fullShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="fullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="fullSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Shield Icon (X: 10 to 86) -->
  <g transform="translate(8, 4)">
    <!-- Outer Shield Crest -->
    <path d="M 42,4 L 78,16 C 78,54 42,84 42,86 C 42,84 6,54 6,16 Z" 
          fill="url(#fullShieldGrad)" stroke="url(#fullGoldGrad)" stroke-width="2.5" filter="url(#fullGlow)" />

    <!-- Inner Inset Shield -->
    <path d="M 42,9 L 72,19 C 72,50 42,76 42,78 C 42,76 12,50 12,19 Z" 
          fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />

    <!-- Sleek Car Silhouette -->
    <path d="M 21,42 Q 30,31 40,30 L 51,30 Q 61,31 66,40 L 69,45 C 69,45 64,43 58,43 L 26,43 Q 22,43 21,42 Z" 
          fill="url(#fullGoldGrad)" />
    <path d="M 32,40 L 39,33 L 49,33 L 56,40 Z" fill="#0f172a" opacity="0.8" />

    <!-- High-Precision Wrench -->
    <g transform="translate(42, 54) rotate(-35) scale(0.62)">
      <path d="M -8,-24 C -16,-20 -20,-10 -16,-2 C -14,2 -10,4 -6,5 L -6,22 C -6,25 -3,28 0,28 C 3,28 6,25 6,22 L 6,5 C 10,4 14,2 16,-2 C 20,-10 16,-20 8,-24 L 2,-16 L -2,-16 Z" 
            fill="url(#fullSilverGrad)" stroke="#1e293b" stroke-width="1" />
      <circle cx="0" cy="22" r="2.5" fill="#0f172a" />
    </g>

    <!-- ASE Star -->
    <polygon points="42,13 44,17 48,17 45,20 46,24 42,21 38,24 39,20 36,17 40,17" fill="url(#fullGoldGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title: CLAYTON -->
  <text x="104" y="47" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#ffffff">
    CLAYTON
  </text>
  <!-- Accent Title: AUTO REPAIR -->
  <text x="268" y="47" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#38bdf8">
    AUTO
  </text>

  <!-- Tagline badge container -->
  <rect x="104" y="58" width="345" height="22" rx="4" fill="#1e293b" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
  
  <!-- Tagline Text -->
  <text x="114" y="73" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#fbbf24">
    ASE-CERTIFIED
  </text>
  <circle cx="202" cy="69" r="2" fill="#64748b" />
  <text x="212" y="73" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1" fill="#cbd5e1">
    HISTORIC DOWNTOWN
  </text>
  <circle cx="346" cy="69" r="2" fill="#64748b" />
  <text x="356" y="73" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#38bdf8">
    NC INSPECTION
  </text>
</svg>
